name: Inject Build Datetime

on:
  push:
    branches: [ main ]

jobs:
  inject-datetime:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Hawaii time (UTC-10)
        id: dt
        run: |
          DATETIME=$(TZ='Pacific/Honolulu' date '+%Y-%m-%d %H:%M:%S')
          echo "datetime=$DATETIME" >> $GITHUB_OUTPUT
          echo "Hawaii time: $DATETIME"

      - name: Inject datetime into home.html
        run: |
          DATETIME="${{ steps.dt.outputs.datetime }}"
          sed -i "s/var APP_DATETIME = '[^']*'/var APP_DATETIME = '$DATETIME'/" home.html
          echo "Injected into home.html: $DATETIME"

      - name: Inject datetime into payroll.html
        run: |
          DATETIME="${{ steps.dt.outputs.datetime }}"
          sed -i "s/var PAYROLL_DATETIME = '[^']*'/var PAYROLL_DATETIME = '$DATETIME'/" payroll.html
          echo "Injected into payroll.html: $DATETIME"

      - name: Inject datetime into version.html
        run: |
          DATETIME="${{ steps.dt.outputs.datetime }}"
          sed -i "s/var LATEST_DATETIME = '[^']*'/var LATEST_DATETIME = '$DATETIME'/" version.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add home.html payroll.html version.html && git commit -m "auto: inject build datetime ${{ steps.dt.outputs.datetime }}")
          git push
