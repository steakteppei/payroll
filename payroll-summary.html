<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Steak Teppei — Payroll Summary</title>
<style>
:root{
  --bg:#0f1117;--surface:#171b24;--surface2:#1e2330;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --text:#e8eaf0;--text-sub:#8892a4;--text-hint:#4a5568;
  --orange:#f97316;--orange-dim:rgba(249,115,22,.15);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --blue:#3b82f6;--yellow:#eab308;--red:#ef4444;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:-apple-system,'DM Sans',sans-serif;color:var(--text);min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.topbar-back{background:none;border:none;color:var(--text-sub);font-size:22px;cursor:pointer;padding:0;line-height:1;}
.topbar-title{font-size:13px;font-weight:700;color:var(--orange);font-family:'JetBrains Mono',monospace;letter-spacing:.04em;}
.topbar-sub{font-size:11px;color:var(--text-hint);}
.content{padding:14px;max-width:680px;margin:0 auto;}
.loading{text-align:center;padding:60px 0;color:var(--text-hint);font-size:13px;}
.error{text-align:center;padding:40px;color:var(--red);font-size:13px;}

/* Summary cards */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.summary-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;}
.summary-label{font-size:9px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.summary-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.summary-val.orange{color:var(--orange);}
.summary-val.yellow{color:var(--yellow);}
.summary-val.green{color:var(--green);}
.summary-val.blue{color:var(--blue);}

/* Section */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.section-header{padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:.06em;}

/* Bar chart */
.bar-chart{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{font-size:10px;color:var(--text-sub);width:72px;flex-shrink:0;text-align:right;}
.bar-track{flex:1;background:var(--surface2);border-radius:3px;height:18px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;transition:width .5s ease;}
.bar-fill.orange{background:var(--orange);opacity:.8;}
.bar-fill.blue{background:var(--blue);opacity:.8;}
.bar-val{font-size:9px;font-weight:700;color:#fff;}
.bar-val-out{font-size:9px;color:var(--text-hint);margin-left:4px;}

/* Employee table */
.emp-table{width:100%;border-collapse:collapse;font-size:11px;}
.emp-table th{text-align:left;padding:7px 14px;color:var(--text-hint);font-weight:600;border-bottom:1px solid var(--border2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.emp-table td{padding:7px 14px;border-bottom:.5px solid var(--border);}
.emp-table tr:last-child td{border-bottom:none;}
.emp-table .num{text-align:right;font-family:'JetBrains Mono',monospace;}
.emp-table .tips-val{color:var(--yellow);font-weight:700;}

/* Period list */
.period-list{display:flex;flex-direction:column;}
.period-item{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .1s;}
.period-item:last-child{border-bottom:none;}
.period-item:hover{background:var(--surface2);}
.period-item.active{background:var(--orange-dim);border-left:2px solid var(--orange);}
.period-label{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);}
.period-meta{font-size:10px;color:var(--text-hint);margin-top:1px;}
.period-tips{font-size:13px;font-weight:700;color:var(--yellow);}

.empty{text-align:center;padding:30px;color:var(--text-hint);font-size:12px;}
.ver{text-align:center;font-size:10px;color:var(--text-hint);padding:12px 0 20px;opacity:.5;}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="window.location.href='payroll.html'">‹</button>
  <div>
    <div class="topbar-title">PAYROLL SUMMARY</div>
    <div class="topbar-sub">Steak Teppei · Ala Moana</div>
  </div>
</div>

<div class="content">
  <div id="loadingEl" class="loading">⏳ Loading payroll history...</div>
  <div id="mainContent" style="display:none;"></div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwp4HIZzJ9kfcecKR1syGXPhXpB-qkdl-5_OeVYgNvYsybn4JSA3Y7CvIFFZpKznK5h/exec';
var allRecords = [];
var selectedId = null;

function fmtShort(iso) {
  if (!iso) return '?';
  var p = iso.split('-');
  return parseInt(p[1]) + '/' + parseInt(p[2]) + '/' + p[0].slice(2);
}
function fmtMon(iso) {
  if (!iso) return '?';
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = iso.split('-');
  return months[parseInt(p[1])-1] + ' ' + p[0];
}
function fmt$(n) { return '$' + parseFloat(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmt2(n) { return parseFloat(n||0).toFixed(2); }

function loadData() {
  fetch(GAS_URL + '?action=list')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && data.records && data.records.length) {
        allRecords = data.records;
      } else {
        try { allRecords = JSON.parse(localStorage.getItem('st_payroll_history') || '[]'); } catch(e){ allRecords = []; }
      }
      document.getElementById('loadingEl').style.display = 'none';
      if (!allRecords.length) {
        document.getElementById('mainContent').style.display = '';
        document.getElementById('mainContent').innerHTML = '<div class="empty">No payroll records yet.<br>Save a payroll from the main screen first.</div>';
        return;
      }
      selectedId = allRecords[0].id;
      renderAll();
    })
    .catch(function(){
      try { allRecords = JSON.parse(localStorage.getItem('st_payroll_history') || '[]'); } catch(e){ allRecords = []; }
      document.getElementById('loadingEl').style.display = 'none';
      renderAll();
    });
}

function renderAll() {
  document.getElementById('mainContent').style.display = '';
  var html = '';

  // ── 全期間サマリー ──
  var totalTips = allRecords.reduce(function(s,r){ return s + parseFloat(r.tipsTotal||0); }, 0);
  var totalHrs  = allRecords.reduce(function(s,r){ return s + parseFloat(r.totalHours||0); }, 0);
  var avgTips   = allRecords.length ? totalTips / allRecords.length : 0;
  var avgRate   = totalHrs > 0 ? totalTips / totalHrs : 0;

  html += '<div class="summary-grid">'
    + '<div class="summary-card"><div class="summary-label">Total Tips (all periods)</div><div class="summary-val orange">' + fmt$(totalTips) + '</div></div>'
    + '<div class="summary-card"><div class="summary-label">Avg Tips / Period</div><div class="summary-val yellow">' + fmt$(avgTips) + '</div></div>'
    + '<div class="summary-card"><div class="summary-label">Avg Tip Rate</div><div class="summary-val green">$' + fmt2(avgRate) + '/h</div></div>'
    + '<div class="summary-card"><div class="summary-label">Payroll Periods</div><div class="summary-val blue">' + allRecords.length + '</div></div>'
    + '</div>';

  // ── チップ推移バーチャート ──
  var chartRecords = allRecords.slice(0, 12).reverse();
  var maxTips = Math.max.apply(null, chartRecords.map(function(r){ return parseFloat(r.tipsTotal||0); }));
  html += '<div class="section"><div class="section-header">Tips by Period (last 12)</div><div class="bar-chart">';
  chartRecords.forEach(function(r) {
    var v = parseFloat(r.tipsTotal||0);
    var pct = maxTips > 0 ? Math.round(v/maxTips*100) : 0;
    var label = fmtShort(r.from);
    html += '<div class="bar-row">'
      + '<div class="bar-label">' + label + '</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:' + pct + '%">'
      + (pct > 15 ? '<span class="bar-val">' + fmt$(v) + '</span>' : '')
      + '</div>'
      + (pct <= 15 ? '<span class="bar-val-out">' + fmt$(v) + '</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  // ── 期間一覧 ──
  html += '<div class="section"><div class="section-header">All Periods — select to see breakdown</div><div class="period-list">';
  allRecords.forEach(function(r) {
    var isActive = r.id === selectedId;
    var label = fmtShort(r.from) + ' – ' + fmtShort(r.to);
    var payDate = r.payDate ? 'Pay: ' + fmtShort(r.payDate) : '';
    html += '<div class="period-item' + (isActive ? ' active' : '') + '" onclick="selectPeriod(' + r.id + ')">'
      + '<div><div class="period-label">' + label + '</div><div class="period-meta">' + payDate + '</div></div>'
      + '<div class="period-tips">' + fmt$(r.tipsTotal) + '</div>'
      + '</div>';
  });
  html += '</div></div>';

  // ── 選択期間の従業員別内訳 ──
  var sel = allRecords.find(function(r){ return r.id === selectedId; });
  if (sel && sel.employees && sel.employees.length) {
    html += '<div class="section"><div class="section-header">Employee Breakdown — ' + fmtShort(sel.from) + ' – ' + fmtShort(sel.to) + '</div>';
    html += '<table class="emp-table"><tr><th>Employee</th><th class="num">Reg Hrs</th><th class="num">OT Hrs</th><th class="num">Tip Hrs</th><th class="num">Tips</th></tr>';
    sel.employees.forEach(function(e) {
      if (parseFloat(e.tipHours||0) > 0 || e.key === 'kacee') {
        html += '<tr>'
          + '<td>' + (e.display||e.key) + '</td>'
          + '<td class="num">' + fmt2(e.reg) + '</td>'
          + '<td class="num">' + fmt2(e.ot) + '</td>'
          + '<td class="num">' + fmt2(e.tipHours) + '</td>'
          + '<td class="num tips-val">$' + fmt2(e.tips) + '</td>'
          + '</tr>';
      }
    });
    html += '</table></div>';

    // ── 従業員別チップバーチャート ──
    var empTips = sel.employees.filter(function(e){ return parseFloat(e.tips||0) > 0; });
    var maxEmpTip = Math.max.apply(null, empTips.map(function(e){ return parseFloat(e.tips||0); }));
    html += '<div class="section"><div class="section-header">Tips by Employee</div><div class="bar-chart">';
    empTips.forEach(function(e) {
      var v = parseFloat(e.tips||0);
      var pct = maxEmpTip > 0 ? Math.round(v/maxEmpTip*100) : 0;
      var name = (e.display||e.key).split(' ')[0];
      html += '<div class="bar-row">'
        + '<div class="bar-label">' + name + '</div>'
        + '<div class="bar-track"><div class="bar-fill blue" style="width:' + pct + '%">'
        + (pct > 20 ? '<span class="bar-val">$' + fmt2(v) + '</span>' : '')
        + '</div>'
        + (pct <= 20 ? '<span class="bar-val-out">$' + fmt2(v) + '</span>' : '')
        + '</div></div>';
    });
    html += '</div></div>';
  }

  html += '<div class="ver">Steak Teppei Payroll Summary · v1.0</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function selectPeriod(id) {
  selectedId = id;
  renderAll();
}

loadData();
</script>
</body>
</html>
